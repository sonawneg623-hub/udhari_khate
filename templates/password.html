{% extends "base.html" %}
{% block title %}पासवर्ड बदला{% endblock %}
{% block content %}
<div class="page-head"><h1>पासवर्ड बदला</h1></div>

<form class="card form" method="post" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field">
    <span>सध्याचा पासवर्ड</span>
    <input type="password" name="old" autocomplete="current-password" required>
  </label>
  <label class="field">
    <span>नवीन पासवर्ड (किमान ६ अक्षरे)</span>
    <input type="password" name="new" autocomplete="new-password" minlength="6" required>
  </label>
  <label class="field">
    <span>नवीन पासवर्ड पुन्हा टाका</span>
    <input type="password" name="again" autocomplete="new-password" minlength="6" required>
  </label>
  <div class="actions">
    <button class="btn btn-primary btn-lg" type="submit">{{ ic('check') }} पासवर्ड बदला</button>
    <a class="btn btn-ghost btn-lg" href="{{ url_for('dashboard') }}">रद्द करा</a>
  </div>
</form>
{% endblock %}
